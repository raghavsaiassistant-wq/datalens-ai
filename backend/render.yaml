services:
  - type: web
    name: datalens-ai-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -k gthread --threads 4 -b 0.0.0.0:$PORT app:app"
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: FLASK_ENV
        value: production
      - key: MAX_FILE_SIZE_MB
        value: "25"
      - key: JOB_TTL_SECONDS
        value: "3600"
      - key: SAMPLE_MAX_ROWS_FOR_AI
        value: "500"
      - key: SAMPLE_MAX_ROWS_FOR_DISPLAY
        value: "30000"
      - key: PYTHON_VERSION
        value: 3.11.9
